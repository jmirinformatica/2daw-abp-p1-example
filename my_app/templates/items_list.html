{% extends '_base.html' %}
{% block content %}
	<h3>Items</h3>
	<table>
		<tr>
			<th>ID</th>
			<th>NOM</th>
			<th>UNITATS</th>
			<th>SUPERMERCAT</th>
		</tr>

		{% for item in items %}
		<tr>
			<td><a href="/items/read/{{ item.id }}">{{ item.id }}</a></td>
			<td><a href="/items/read/{{ item.id }}">{{ item.nom }}</a></td>
			<td><a href="/items/read/{{ item.id }}">{{ item.unitats }}</a></td>
			<td><a href="/items/read/{{ item.id }}">{{ item.store.nom }}</a></td>
		</tr>
		{% endfor %}
	</table>
	{% if current_user.is_editor() %}
		<a href="/items/create">Crear un nou item</a>
	{% endif %}
{% endblock %}
